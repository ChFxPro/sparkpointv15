# gitleaks config for sparkpointv15
#
# Starts from the upstream default ruleset (~200 rules: cloud keys, tokens,
# private keys, etc.) and adds only what this repo specifically needs.
#
# History was scanned on 2026-08-11: 250 commits, 4.93 MB, two findings, both
# the same false positive — see the info.tsx note below. No real credential has
# been committed to this repository.

title = "sparkpointv15 gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Paths that never contain real secrets"
paths = [
  # AUTOGENERATED by Figma Make. Contains exactly two values: the Supabase
  # project ref and `publicAnonKey`.
  #
  # The anon key is a JWT, so gitleaks' generic `jwt` rule fires on it — twice,
  # at commits 565f6f0 and 626c10f (both "files from Figma Make", Feb 2026).
  # It is NOT a secret: its decoded claim is `role: anon`, it is issued for
  # browser use, and it ships in the public JS bundle by design. Treating it as
  # a leak would mean the gate is red forever on a value that is meant to be
  # public.
  #
  # Residual risk, stated plainly: this is a path allowlist, so a *service_role*
  # key pasted into this same file would also be skipped by gitleaks. Two things
  # cover that gap — the file is autogenerated and should never be hand-edited
  # ("DO NOT EDIT CONTENTS" is its first line), and GitHub's own secret scanning
  # and push protection are enabled on this repo and do recognise Supabase
  # service_role keys specifically. If this file ever stops being generated,
  # narrow this entry.
  '''^src/utils/supabase/info\.tsx$''',

  # Lockfiles carry integrity hashes that trip entropy heuristics.
  '''package-lock\.json$''',
  # Build output is generated, never authored.
  '''^build/''',
  '''^output/''',
  # Vendored fonts and image assets.
  '''\.(woff2?|ttf|eot|png|jpe?g|gif|webp|avif|ico|pdf|zip)$''',
]
