<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A World of Connections lockup</title>
<!--
  The master for the transparent logo PNGs (and the email generator's copies in
  scripts/gala-invitation/assets/). The lockup itself is shared/lockup.css +
  shared/lockup.js, ported exactly from the brand kit's lockup.html
  (Branding/Gala/WorldOfConnections/). Each version is screenshotted on its own,
  clipped to the lockup plus its globe art, with a transparent background.
-->
<style>
  {{INCLUDE:shared/lockup.css}}
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; }
  body { display: grid; gap: 260px; justify-items: center; padding: 220px 120px; }
</style>
</head>
<body>
  <div class="lk-slot" id="dark"></div>
  <div class="lk-slot light" id="light"></div>
  <script>{{INCLUDE:shared/lockup.js}}</script>
</body>
</html>
