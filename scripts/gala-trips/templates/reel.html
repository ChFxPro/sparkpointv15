<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- One trip's promo video, composited frame by frame. pack.mjs injects
     window.REEL (the timeline for one layout and cut), then calls frame(t).
     Shots crossfade; footage frames are pre-extracted JPEGs, stills get a slow
     camera move, and the cards (open, facts, close) are drawn here in the Gala
     style. The price line exists only when REEL.price is set, which pack.mjs
     does only when trips.json says showPrices. -->
<style>
  {{INCLUDE:scripts/gala-print/templates/shared/lockup.css}}
  html, body { margin: 0; background: #0b1322; overflow: hidden; }
  #stage { position: relative; overflow: hidden; background: #0b1322; color: #f7f1e5; font-family: 'Josefin Sans'; }
  .shot { position: absolute; inset: 0; overflow: hidden; opacity: 0; }
  .shot img.bg { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
  .shade { position: absolute; inset: 0; }
  .shade.foot { background: linear-gradient(180deg, rgba(11,19,34,.45) 0%, rgba(11,19,34,0) 22%, rgba(11,19,34,0) 58%, rgba(11,19,34,.82) 100%); }
  .shade.card { background: radial-gradient(ellipse at 50% 45%, rgba(11,19,34,.55), rgba(11,19,34,.9) 75%); }
  .shade.night { background: radial-gradient(ellipse at 50% 40%, #16233d, #0b1322 70%); }
  .deco-frame { --frame-inset: calc(22px * var(--u)); }

  /* Lower-third caption on footage. */
  .cap { position: absolute; left: calc(110px * var(--u)); bottom: calc(104px * var(--u)); max-width: 70%; }
  .cap .k { display: flex; align-items: center; gap: .9em; color: #d9b56a; font: 600 calc(20px * var(--u)) 'Josefin Sans'; letter-spacing: .42em; text-transform: uppercase; }
  .cap .k::before { content: ''; width: 2.6em; height: 1px; background: currentColor; opacity: .8; }
  .cap .t { margin-top: .45em; font: 300 calc(52px * var(--u)) / 1.1 'Josefin Sans'; letter-spacing: .01em; text-shadow: 0 2px 24px rgba(11,19,34,.6); }
  .l-9x16 .cap, .l-1x1 .cap { left: calc(70px * var(--u)); right: calc(70px * var(--u)); max-width: none; bottom: calc(150px * var(--u)); }
  .l-9x16 .cap .t { font-size: calc(54px * var(--u)); }

  /* Running mark in the corner during footage. */
  .corner { position: absolute; left: calc(64px * var(--u)); top: calc(58px * var(--u)); display: flex; align-items: center; gap: .8em; color: #f1d9a0; font: 600 calc(17px * var(--u)) 'Josefin Sans'; letter-spacing: .36em; text-transform: uppercase; opacity: 0; text-shadow: 0 1px 12px rgba(11,19,34,.7); }
  .corner img { width: calc(22px * var(--u)); }

  /* Cards. */
  .center { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; text-align: center; padding: 0 calc(90px * var(--u)); }
  .conn { display: flex; align-items: center; gap: 1em; color: #d9b56a; font: 600 calc(20px * var(--u)) 'Josefin Sans'; letter-spacing: .5em; margin-right: -.5em; text-transform: uppercase; }
  .conn::before, .conn::after { content: ''; width: 3em; height: 1px; background: currentColor; opacity: .75; }
  .name { margin-top: .32em; font: 700 calc(150px * var(--u)) / .95 'Josefin Sans'; text-transform: uppercase; letter-spacing: .16em; margin-right: -.16em; text-shadow: .045em .045em 0 #0b1322, .07em .07em 0 #d9b56a; }
  .name span { display: inline-block; }
  .l-9x16 .name { font-size: calc(124px * var(--u)); }
  .line { margin-top: .55em; color: #f1d9a0; font: italic 300 calc(40px * var(--u)) 'Josefin Sans'; letter-spacing: .03em; }
  .hook { margin-top: 1.2em; max-width: 30em; color: rgba(247,241,229,.88); font: 300 calc(28px * var(--u)) / 1.45 'Josefin Sans'; }
  .facts { display: flex; gap: 1.2em; align-items: center; justify-content: center; font: 600 calc(32px * var(--u)) 'Josefin Sans'; letter-spacing: .34em; margin-right: -.34em; text-transform: uppercase; }
  .facts b, .hl b { width: .42em; height: .42em; rotate: 45deg; border: 1px solid #d9b56a; flex: none; }
  .hls { margin-top: 1.3em; display: grid; gap: .85em; justify-items: start; text-align: left; }
  .hl { display: flex; align-items: center; gap: 1.1em; font: 300 calc(50px * var(--u)) / 1.2 'Josefin Sans'; }
  .l-9x16 .hl { font-size: calc(46px * var(--u)); }
  .l-1x1 .hl { font-size: calc(42px * var(--u)); }
  .price { margin-top: 1.8em; color: #f1d9a0; font: 600 calc(22px * var(--u)) 'Josefin Sans'; letter-spacing: .3em; text-transform: uppercase; }
  .price strong { display: block; margin-top: .35em; color: #f7f1e5; font: 300 calc(54px * var(--u)) 'Josefin Sans'; letter-spacing: .06em; }
  .rule { display: flex; align-items: center; gap: .8em; margin: 1.6em 0 0; }
  .rule i { width: calc(110px * var(--u)); height: 5px; border-top: 1px solid #f1d9a0; border-bottom: 1px solid #f1d9a0; opacity: .6; }
  .rule img { width: calc(26px * var(--u)); }
  .rule.top { margin: 0 0 1.4em; }
  .cta { margin-top: 1.3em; font: 600 calc(36px * var(--u)) 'Josefin Sans'; letter-spacing: .3em; margin-right: -.3em; text-transform: uppercase; }
  .tag { margin-top: 1em; font: 300 calc(48px * var(--u)) 'Josefin Sans'; letter-spacing: .02em; }
  .tag em { font-style: normal; font-weight: 600; color: #d9b56a; }
  .when { margin-top: 1.6em; color: #f1d9a0; font: 400 calc(24px * var(--u)) 'Josefin Sans'; letter-spacing: .32em; margin-right: -.32em; text-transform: uppercase; }
  .lk { font-size: calc(128px * var(--u)); }
  .lk.small { font-size: calc(64px * var(--u)); }
  .l-9x16 .lk { font-size: calc(110px * var(--u)); }
  .l-9x16 .lk.small { font-size: calc(62px * var(--u)); }
  .rise { opacity: 0; }
</style>
</head>
<body>
<div id="stage"><div class="corner" id="corner"><img src="{{PUBLIC}}/assets/brand/sparkmark-256.webp" alt=""><span id="cornerText"></span></div></div>
<script>
const R = window.REEL;
const { W, H } = R;
const U = Math.min(W, H) / 1080;
const stage = document.getElementById('stage');
stage.style.width = W + 'px'; stage.style.height = H + 'px';
stage.style.setProperty('--u', U);
stage.classList.add('l-' + R.layout);
document.getElementById('cornerText').textContent = `Connection ${R.trip.connection} · ${R.trip.name}`;
const MARK = '{{PUBLIC}}/assets/brand/sparkmark-256.webp';
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = (x) => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const easeOut = (x) => 1 - Math.pow(1 - clamp(x), 3);
const seg = (t, a, b) => clamp((t - a) / (b - a));
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const rule = (cls = '') => `<div class="rule ${cls}"><i></i><img src="${MARK}" alt=""><i></i></div>`;

// Build one layer per shot.
const layers = R.shots.map((s) => {
  const el = document.createElement('div');
  el.className = 'shot';
  let html = '';
  if (s.image || s.frames) html += '<img class="bg" alt="">';
  html += `<div class="shade ${s.shade || (s.card ? 'card' : 'foot')}"></div>`;
  if (s.caption) html += `<div class="cap rise"><div class="k">${esc(s.caption[0])}</div><div class="t">${esc(s.caption[1])}</div></div>`;
  if (s.card === 'open') html += `<div class="center">
      <div class="lk-slot small rise" data-step="0"></div>
      <div class="conn rise" data-step="1" style="margin-top:calc(64px * var(--u))">Connection ${esc(R.trip.connection)}</div>
      <div class="name" data-letters>${[...R.trip.name].map((c) => `<span>${c === ' ' ? '&nbsp;' : esc(c)}</span>`).join('')}</div>
      <div class="line rise" data-step="2">${esc(R.trip.line)}</div>
    </div><div class="deco-frame"></div>`;
  if (s.card === 'facts') html += `<div class="center">
      ${rule('top rise')}
      <div class="facts rise" data-step="0">${R.trip.facts.map(esc).join('<b></b>')}</div>
      <div class="hls">${R.trip.highlights.map((h, i) => `<div class="hl rise" data-step="${i + 1}"><b></b><span>${esc(h)}</span></div>`).join('')}</div>
      ${R.price ? `<div class="price rise" data-step="${R.trip.highlights.length + 1}">Your trip<strong>${esc(R.price)}</strong></div>` : ''}
    </div><div class="deco-frame"></div>`;
  if (s.card === 'close') html += `<div class="center">
      <div class="lk-slot rise" data-step="0"></div>
      <div class="cta rise" data-step="1" style="margin-top:1.8em">${esc(R.closeLine)}</div>
      <div class="tag rise" data-step="2">Every journey <em>connects back home.</em></div>
      <div class="when rise" data-step="3">${esc(R.when)}</div>
    </div><div class="deco-frame"></div>`;
  el.innerHTML = html;
  stage.insertBefore(el, document.getElementById('corner'));
  return el;
});
</script>
<script>
  {{INCLUDE:scripts/gala-print/templates/shared/lockup.js}}
</script>
<script>
const imgs = layers.map((el) => el.querySelector('img.bg'));
const cache = new Map();
function load(src) {
  if (!cache.has(src)) {
    const im = new Image(); im.src = src;
    cache.set(src, im.decode().then(() => im, () => { throw new Error('Could not load ' + src); }));
    if (cache.size > 24) cache.delete(cache.keys().next().value);
  }
  return cache.get(src);
}

// Places an image to cover the frame, with a camera move: zoom from z0 to z1
// and drift (in fractions of the spare width/height) from p0 to p1.
function place(img, nw, nh, s, p) {
  const z = s.z0 + (s.z1 - s.z0) * p;
  const scale = Math.max(W / nw, H / nh) * z;
  const sw = nw * scale, sh = nh * scale;
  const fx = s.fx0 + (s.fx1 - s.fx0) * p, fy = s.fy0 + (s.fy1 - s.fy0) * p;
  const x = -(sw - W) * fx, y = -(sh - H) * fy;
  img.style.width = nw + 'px'; img.style.height = nh + 'px';
  img.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
}

function steps(el, t0) {
  for (const r of el.querySelectorAll('.rise')) {
    const k = Number(r.dataset.step || 0);
    const a = easeOut(seg(t0, .35 + k * .45, 1.15 + k * .45));
    r.style.opacity = a;
    r.style.transform = `translateY(${(1 - a) * 16 * U}px)`;
  }
  const letters = el.querySelectorAll('[data-letters] span');
  letters.forEach((sp, i) => {
    const a = easeOut(seg(t0, .9 + i * .07, 1.6 + i * .07));
    sp.style.opacity = a;
    sp.style.transform = `translateY(${(1 - a) * .18}em)`;
  });
}

window.DURATION = R.duration;
window.frame = async (t) => {
  const pending = [];
  R.shots.forEach((s, i) => {
    const el = layers[i];
    const fadeIn = s.fadeIn ?? R.xfade, fadeOut = s.fadeOut ?? R.xfade;
    const a = Math.min(seg(t, s.start, s.start + fadeIn || 1e-6), 1 - seg(t, s.end - fadeOut, s.end));
    const on = t >= s.start && t < s.end;
    el.style.opacity = on ? (i === 0 && !s.fadeIn ? Math.min(1, 1 - seg(t, s.end - fadeOut, s.end)) : a) : 0;
    el.style.visibility = on ? 'visible' : 'hidden';
    if (!on) return;
    const local = t - s.start, p = local / (s.end - s.start);
    const img = imgs[i];
    if (img) {
      let src = s.image;
      if (s.frames) src = s.frames.pattern.replace('%05d', String(Math.min(s.frames.count, 1 + Math.floor(local * s.frames.fps))).padStart(5, '0'));
      pending.push(load(src).then((im) => { if (img.src !== im.src) img.src = im.src; place(img, im.naturalWidth, im.naturalHeight, s.move, s.frames ? 0 : p); }));
    }
    steps(el, local);
    const cap = el.querySelector('.cap');
    if (cap) {
      const ca = easeOut(seg(local, .5, 1.3)) * (1 - seg(local, s.end - s.start - .9, s.end - s.start - .3));
      cap.style.opacity = ca; cap.style.transform = `translateY(${(1 - ca) * 14 * U}px)`;
    }
  });
  const foot = R.shots.find((s) => t >= s.start && t < s.end && !s.card && !s.map);
  document.getElementById('corner').style.opacity = foot ? Math.min(1, seg(t, foot.start, foot.start + .6)) * .9 : 0;
  await Promise.all(pending);
};
window.ready = (async () => {
  await document.fonts.ready;
  // Preload every still so the first frame of each shot is ready.
  await Promise.all(R.shots.filter((s) => s.image).map((s) => load(s.image)));
})();
</script>
</body>
</html>
