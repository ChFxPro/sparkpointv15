name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install deps
        run: npm ci

      - name: Build
        env:
          PUBLIC_BASE: /
          SITE_ORIGIN: https://www.yoursparkpoint.org
          PUBLIC_ORIGIN: https://www.yoursparkpoint.org
          VITE_SITE_ORIGIN: https://www.yoursparkpoint.org
        run: npm run build

      - name: Add CNAME for custom domain
        run: |
          # Use apex as the GitHub Pages custom domain so GitHub provisions the TLS cert for the root domain.
          # We will keep www as a CNAME to the apex in DNS.
          echo "yoursparkpoint.org" > build/CNAME

      - name: Disable Jekyll
        run: |
          touch build/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Vite `outDir` is `build`, so GitHub Pages must publish from build/.
          path: ./build

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
