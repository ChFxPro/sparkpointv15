name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        # v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node
        # v4.4.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install deps
        run: npm ci

      - name: Build
        env:
          PUBLIC_BASE: /
          SITE_ORIGIN: https://yoursparkpoint.org
          PUBLIC_ORIGIN: https://yoursparkpoint.org
          VITE_SITE_ORIGIN: https://yoursparkpoint.org
        run: npm run build

      - name: Add CNAME for custom domain
        run: |
          # Use apex as the GitHub Pages custom domain so GitHub provisions the TLS cert for the root domain.
          # We will keep www as a CNAME to the apex in DNS.
          echo "yoursparkpoint.org" > build/CNAME

      - name: Disable Jekyll
        run: |
          touch build/.nojekyll

      - name: Configure Pages
        # v5.0.0
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Upload artifact
        # v3.0.1
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          # Vite `outDir` is `build`, so GitHub Pages must publish from build/.
          path: ./build

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        # v5.0.0
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
